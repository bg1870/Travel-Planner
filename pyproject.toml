[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "travel-planner"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "langgraph>=0.4",
    "langchain>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.3",
    "langsmith>=0.2",
    "pyyaml>=6.0",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = [
    "langgraph-cli>=0.2",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["src/travel_planner"]
